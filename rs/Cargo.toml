[package]
name = "watklok-native"
version = "0.1.0"
edition = "2024"
authors = ["SNIPPIK"]

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.16.1", features = [
    "napi10", "async", "node_version_detect",
    "tokio_rt", "serde-json"
] }
napi-derive = "3.7.0"
arc-swap = "1.9.3"

# For RingBuffer
crossbeam-utils = "0.8.23"

# For OGGParser
bytes = "1.12.1"
memchr = "2.8.3"

# For crypto
zeroize = "1.9.1"
davey = "0.2.0-beta.1"
rand = "0.10.3"
aead = { version = "0.6.1", default-features = false }
aes-gcm = { version = "0.11.1", features = ["aes", "zeroize"] }

# For WebSocket
parking_lot = "0.13.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.30", features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
serde_json = { version = "1.0.154", features = ["default"] }

# Профиль релиза
[profile.release]
opt-level = 3            # Максимальная оптимизация скорости кода (по умолчанию в release)
lto = true               # Включает Link-Time Optimization (оптимизация между всеми крейтами)
codegen-units = 1        # LLVM оптимизирует всё как один блок, улучшая инлайнинг и глобальный анализ
panic = "unwind"          # Отключает раскрутку стека при панике (уменьшает размер файла и ускоряет код)
strip = true             # Полностью удаляет отладочные символы и таблицы из бинарника